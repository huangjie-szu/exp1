// ================= Quit function =================
function injectQuitButton() {
  const old = document.getElementById('quit-btn-dynamic');
  if (old) old.remove();
  let content = document.querySelector('.jspsych-content') || document.body;
  const btn = document.createElement('button');
  btn.id = 'quit-btn-dynamic';
  btn.className = 'quit-btn';
  btn.textContent = '✕ Exit Study';
  btn.onclick = showQuitModal;
  content.insertBefore(btn, content.firstChild);
}
function showQuitModal() {
  if (quitListener) { jsPsych.pluginAPI.cancelKeyboardResponse(quitListener); quitListener = null; }
  const modal = document.createElement('div');
  modal.id = 'quit-modal';
  modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);' +
    'display:flex;justify-content:center;align-items:center;z-index:999999;';
  modal.innerHTML = '<div style="background:#fff;padding:40px;border-radius:12px;max-width:480px;text-align:center;">' +
    '<h3 style="font-size:24px;margin-bottom:16px;color:#dc3545;">Exit the study?</h3>' +
    '<p style="font-size:17px;line-height:1.7;margin-bottom:28px;">You may exit at any time. Your responses will not be saved or uploaded, and you will not receive the participation payment.</p>' +
    '<div style="display:flex;gap:14px;justify-content:center;">' +
    '<button id="btn-quit-yes" style="padding:12px 26px;background:#dc3545;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:16px;font-weight:bold;">Exit</button>' +
    '<button id="btn-quit-no" style="padding:12px 26px;background:#6c757d;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:16px;">Continue</button>' +
    '</div></div>';
  document.body.appendChild(modal);
  document.getElementById('btn-quit-yes').onclick = confirmQuit;
  document.getElementById('btn-quit-no').onclick = () => { modal.remove(); bindQuitKey(); };
}
function bindQuitKey() {
  if (quitListener) jsPsych.pluginAPI.cancelKeyboardResponse(quitListener);
  quitListener = jsPsych.pluginAPI.getKeyboardResponse({
    callback_function: showQuitModal, valid_responses:['p','P'],
    rt_method:'performance', persist:true, allow_held_key:false
  });
}
function confirmQuit() {
  document.body.innerHTML = '<div style="text-align:center;padding:100px 40px;font-family:Arial,sans-serif;">' +
    '<h2 style="font-size:26px;color:#333;margin-bottom:16px;">You have exited the study</h2>' +
    '<p style="font-size:17px;color:#6c757d;">Your responses will not be saved or uploaded, and you will not receive the participation payment.<br>You may now close this page and return to Prolific.</p></div>';
}

const GOOGLE_URL = 'https://script.google.com/macros/s/AKfycbyjkgCtdB-YuEpu9Qv9on_IU-9yF_K0BZ8Wvg3HAaP00TrLzK6vdypx1XaBFU0S0csncg/exec';

// 修复版发送：sendBeacon(<=64KB) 优先，超出或失败则用普通 fetch（无 64KB 限制），并返回 Promise 以便跳转前等待
function sendText(url, text) {
  console.log('[upload] payload bytes =', text.length);
  try {
    if (text.length < 60000 && navigator.sendBeacon && navigator.sendBeacon(url, new Blob([text], {type: 'text/plain'}))) {
      return Promise.resolve(true);
    }
  } catch (e) {}
  return fetch(url, { method: 'POST', mode: 'no-cors',
    headers: { 'Content-Type': 'text/plain' }, body: text })
    .then(function() { return true; })
    .catch(function() { return false; });
}

function buildPayload(tag) {
  return {
    tag: tag,
    uid: uid,
    prolific_pid: prolificPid,
    study_id: studyId,
    session_id: sessionId,
    client_time: new Date().toISOString(),
    elapsed_ms: Date.now() - expStartTime,
    user_agent: navigator.userAgent,
    csv: jsPsych.data.get().csv()
  };
}

function uploadCSV(isPartial, tag) {
  tag = tag || (isPartial ? 'partial' : 'complete');
  return sendText(GOOGLE_URL, JSON.stringify(buildPayload(tag)));
}

function downloadCSV(isPartial) {
  const csv = jsPsych.data.get().csv();
  const blob = new Blob(['\uFEFF' + csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (isPartial ? 'ampartial_' : 'amexp1_') + uid + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}

timeline.push({

// ================= Titration task (fixation → stimuli → blank; first reversal ends) =================
function renderOptions(cfg, X, round, practice) {
  return `
    <div class="decision-container">
      <div class="option-box">
        <div class="option-desc">Receive now</div>
        <div class="option-amount">$${X}</div>
        <div class="option-key">Press F</div>
      </div>
      <div class="option-box">
        <div class="option-desc">Receive in ${cfg.delayText}</div>
        <div class="option-amount">$${cfg.future}</div>
        <div class="option-key">Press J</div>
      </div>
    </div>
    <div class="round-indicator"></div>`;
}

function createStaircaseBlock(cfg) {
  // cfg: {future, delayText, startX, step, cap, condIndex, condLabel, practice}
  const CAP = cfg.cap;
  const st = { X: cfg.startX, prevX: null, endType: null, finalNow: null, history: [],
               round: 1, ended: false, chosenAmount: null, reminded: false,
               equivalenceEstimate: null, equivPending: false, t0: Date.now() };
  let roundResult = null;

  const fixation = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: '<div class="fixation">+</div>',
    choices: "NO_KEYS",
    trial_duration: 500,
    data: { task: 'fixation', cond_index: cfg.condIndex },
    on_load: function() { injectQuitButton(); }
  };

  const decision = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: function() { return renderOptions(cfg, st.X, st.round, cfg.practice); },
    choices: "NO_KEYS",
    data: { task: 'staircase_round', cond_index: cfg.condIndex, cond_label: cfg.condLabel,
            A: cfg.startX, future: cfg.future, delay_text: cfg.delayText, step: cfg.step, startX: cfg.startX, cap: cfg.cap },
    on_load: function() {
      injectQuitButton();
      let kb = null;
      function bindKeys() {
        kb = jsPsych.pluginAPI.getKeyboardResponse({
          callback_function: onKey,
          valid_responses: ['f','j','F','J'],
          rt_method: 'performance', persist: true, allow_held_key: false
        });
      }
      function showDominatedReminder() {
        const modal = document.createElement('div');
        modal.id = 'dominated-modal';
        modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.55);display:flex;justify-content:center;align-items:center;z-index:999998;';
        modal.innerHTML = '<div style="background:#fff;padding:40px 48px;border-radius:12px;max-width:540px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.25);">' +
          '<h3 style="font-size:23px;margin-bottom:16px;color:#c0392b;">Please answer carefully</h3>' +
          '<p style="font-size:18px;line-height:1.9;margin-bottom:26px;">Please read both options carefully before making your choice.</p>' +
          '<p style="font-size:16px;color:#6c757d;">Press the space bar to continue</p></div>';
        document.body.appendChild(modal);
        jsPsych.pluginAPI.getKeyboardResponse({
          callback_function: function() { modal.remove(); bindKeys(); },
          valid_responses: [' '],
          rt_method: 'performance', persist: false, allow_held_key: false
        });
      }
      function onKey(info) {
        const choice = (info.key.toLowerCase() === 'f') ? 'now' : 'future';
        const rt = info.rt;
        const xAtChoice = st.X;   // 当轮"现在金额"
        // 起始屏（如 10 vs 200 / 100 vs 2000）首次选"现在" → 提示一次（防误触，不计入）
        if (choice === 'now' && xAtChoice === cfg.startX && !st.reminded) {
          st.reminded = true;
          if (kb) jsPsych.pluginAPI.cancelKeyboardResponse(kb);
          showDominatedReminder();
          return;
        }
        // "现在金额"已等于未来金额、被试仍选"未来" → 结束决策，进入等值填空页
        if (choice === 'future' && xAtChoice === cfg.future) {
          st.history.push({ round: st.round, x: xAtChoice, choice: choice, rt: Math.round(rt) });
          st.chosenAmount = cfg.future;
          st.endType = 'at_equality';
          st.ended = true;
          st.equivPending = true;
          roundResult = { round: st.round, x: xAtChoice, choice: choice, rt: Math.round(rt) };
          if (kb) jsPsych.pluginAPI.cancelKeyboardResponse(kb);
          jsPsych.finishTrial({ response: info.key });
          return;
        }
        let ended = false, endType = null;
        if (choice === 'now') { ended = true; endType = 'now'; st.finalNow = xAtChoice; }
        st.history.push({ round: st.round, x: xAtChoice, choice: choice, rt: Math.round(rt) });
        st.chosenAmount = (choice === 'now') ? xAtChoice : cfg.future;
        if (choice === 'future') {
          st.prevX = st.X;
          st.X = Math.min(st.X + cfg.step, CAP);
          if (st.X >= CAP) { ended = true; endType = 'cap'; }
        }
        st.round++;
        if (!ended && st.round > 30) { ended = true; endType = 'max_rounds'; }
        st.ended = ended;
        if (endType) st.endType = endType;
        roundResult = { round: st.round - 1, x: xAtChoice, choice: choice, rt: Math.round(rt) };
        if (kb) jsPsych.pluginAPI.cancelKeyboardResponse(kb);
        jsPsych.finishTrial({ response: info.key });
      }
      bindKeys();
    },
    on_finish: function(data) {
      data.round = roundResult.round;
      data.x = roundResult.x;
      data.choice = roundResult.choice;
      if (st.ended) {
        data.task = cfg.practice ? 'practice_staircase' : 'formal_staircase';
        data.sv = (st.endType === 'now' && st.prevX !== null)
          ? Math.round((st.prevX + st.finalNow) / 2 * 100) / 100 : st.finalNow;
        data.reversal_points = JSON.stringify(st.endType === 'now' ? [st.prevX, st.finalNow] : []);
        data.n_reversals = (st.endType === 'now') ? 1 : 0;
        data.rounds = st.round - (st.endType === 'at_equality' ? 0 : 1);
        data.chosen_amount = st.chosenAmount;
        data.choice_history = JSON.stringify(st.history);
        data.censored = (st.endType === 'now') ? 'no'
          : (st.endType === 'cap' ? 'upper_bound'
          : (st.endType === 'at_equality' ? 'at_equality' : 'max_rounds'));
        data.trial_duration_ms = Date.now() - st.t0;
      }
    }
  };

  const blank = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: '',
    choices: "NO_KEYS",
    trial_duration: function() { return 500 + Math.random() * 300; },
    data: { task: 'isi', cond_index: cfg.condIndex },
    on_load: function() { injectQuitButton(); }
  };

  // 等值填空页：决策屏结束后新开一页呈现（非弹窗）；未触发时在 on_load 立即跳过
  const equivPage = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `<div class="instruction-box">
        <p>How much money received <b>now</b> do you think is equal in value to</p>
        <p style="margin:16px 0;">receiving <b>$${cfg.future}</b> in ${cfg.delayText}?</p>
        <p style="margin:16px 0;">$ <input id="equiv-input" type="number" min="0"
           style="font-size:24px;padding:10px 16px;width:200px;text-align:center;border:2px solid #adb5bd;border-radius:8px;"></p>
        <div class="space-hint" style="margin-top:36px;color:#adb5bd;font-size:17px;">Enter a number and press the space bar to submit</div>
      </div>`,
    choices: "NO_KEYS",
    data: { task: 'equivalence_question', cond_index: cfg.condIndex, cond_label: cfg.condLabel },
    on_load: function() {
      if (!st.equivPending) { jsPsych.finishTrial({ skipped: true }); return; }
      injectQuitButton();
      const equivT0 = performance.now();
      setTimeout(function() {
        const i = document.getElementById('equiv-input');
        if (i) i.focus();
      }, 100);
      function onSpace(e) {
        if (e.key !== ' ') return;
        e.preventDefault();
        const v = parseFloat(document.getElementById('equiv-input').value);
        if (isNaN(v)) return;
        document.removeEventListener('keydown', onSpace);
        jsPsych.finishTrial({ estimate: v, rt: Math.round(performance.now() - equivT0) });
      }
      document.addEventListener('keydown', onSpace);
    }
  };

  const innerLoop = {
    timeline: [fixation, decision, blank, equivPage],
    loop_function: function() { return !st.ended; }
  };

  return {
    timeline: [innerLoop],
    reset: function() {
      st.X = cfg.startX; st.prevX = null; st.endType = null; st.finalNow = null;
      st.history = []; st.round = 1;
      st.ended = false; st.chosenAmount = null; st.reminded = false;
      st.equivalenceEstimate = null; st.equivPending = false; st.t0 = Date.now();
    }
  };
}

// ================= Practice =================
const practiceBlock = createStaircaseBlock({
  future: 100, delayText: '2 weeks', startX: 5, step: 5, cap: 200,
  condIndex: 0, condLabel: 'practice', practice: true
});
const practiceEndPage = {
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `<div class="instruction-box">
      <p>The practice phase is over.</p>
      <p>Press the space bar to enter the formal experiment;</p>
      <p>Press R to restart the practice phase.</p>
    </div>`,
  choices: [' ', 'r', 'R'],
  data: { task: 'practice_end' },
  on_load: function() { injectQuitButton(); }
};
timeline.push({
  timeline: [practiceBlock, practiceEndPage],
  loop_function: function(data) {
    const d = data.values()[data.values().length - 1];
    const again = (d.response === 'r' || d.response === 'R');
    if (again) practiceBlock.reset();
    return again;
  }
});

// "The formal experiment begins now" splash (2 s)
timeline.push({
  type: jsPsychHtmlKeyboardResponse,
  stimulus: '<div style="text-align:center;font-size:36px;font-weight:bold;color:#212529;">The formal experiment begins now</div>',
  choices: "NO_KEYS",
  trial_duration: 2000,
  data: { task: 'splash' },
  on_load: function() { injectQuitButton(); }
});

// ================= Distance perception questions =================
const DIST_LABELS = ['Very close','Relatively close','Somewhat close','Neutral','Somewhat far','Relatively far','Very far'];
function createDistanceQuestion(delayText) {
  const opts = DIST_LABELS.map((l,i) =>
    `<div class="scale-option"><div class="num">${i+1}</div><div class="label">${l}</div></div>`).join('');
  return {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `<div class="scale-question">
        <div class="question-text">How psychologically distant does the next ${delayText} feel to you?</div>
        <div class="scale-options">${opts}</div>
        <div class="scale-hint">Please press a number key from 1 to 7</div>
      </div>`,
    choices: "NO_KEYS",
    data: { task: 'distance_perception', delay_text: delayText },
    on_load: function() {
      let locked = false;
      const kb = jsPsych.pluginAPI.getKeyboardResponse({
        callback_function: function(info) {
          if (locked) return;
          locked = true;
          const n = parseInt(info.key);
          const opt = document.querySelectorAll('.scale-option')[n - 1];
          if (opt) opt.style.cssText += 'border-color:#28a745;background:#d4edda;transform:scale(1.06);';
          setTimeout(function() {
            jsPsych.pluginAPI.cancelKeyboardResponse(kb);
            jsPsych.finishTrial({ response: info.key, rt: Math.round(info.rt), score: n });
          }, 320);
        },
        valid_responses: ['1','2','3','4','5','6','7'],
        rt_method: 'performance', persist: true, allow_held_key: false
      });
      injectQuitButton();
    }
  };
}

function createRestPage() {
  return {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `<div class="instruction-box"><p>You may take a short break now. Press the space bar to continue when you are ready.</p></div>`,
    choices: [' '],
    data: { task: 'rest' },
    on_load: function() { injectQuitButton(); }
  };
}

// ================= Formal experiment (4 conditions; distance question + rest after each) =================
const formalConditions = [
  { future: 200,  delayText: '1 month',  startX: 10,  step: 10,  cap: 400,  condIndex: 1, durQ: 'one month' },
  { future: 2000, delayText: '1 month',  startX: 100, step: 100, cap: 4000, condIndex: 2, durQ: 'one month' },
  { future: 200,  delayText: '12 months', startX: 10,  step: 10,  cap: 400,  condIndex: 3, durQ: 'twelve months' },
  { future: 2000, delayText: '12 months', startX: 100, step: 100, cap: 4000, condIndex: 4, durQ: 'twelve months' }
];

formalConditions.forEach(function(cond) {
  timeline.push(createStaircaseBlock({
    future: cond.future, delayText: cond.delayText, startX: cond.startX, step: cond.step, cap: cond.cap,
    condIndex: cond.condIndex, condLabel: 'cond' + cond.condIndex, practice: false
  }));
  timeline.push(createDistanceQuestion(cond.durQ));
  if (cond.condIndex < 4) timeline.push(createRestPage());
});

// Questionnaire transition
timeline.push({
  type: jsPsychHtmlKeyboardResponse,
  stimulus: `<div class="instruction-box">
      <p>Next, please complete two questionnaires (about 4–6 minutes).</p>
      <p>There are no right or wrong answers. Please respond according to your true feelings.</p>
      <p>Press the space bar to continue.</p>
    </div>`,
  choices: [' '],
  data: { task: 'questionnaire_intro' },
  on_load: function() { injectQuitButton(); }
});

// ================= CFC-14 (14 items, 7-point; B to go back) =================
const CFC_LABELS = ['Not at all like me','Not much like me','Somewhat unlike me','Uncertain','Somewhat like me','Very much like me','Completely like me'];
const cfcItems = [
  'I consider how things might be in the future, and try to influence those things with my day to day behavior.',
  'Often I engage in a particular behavior in order to achieve outcomes that may not result for many years.',
  'I only act to satisfy immediate concerns, figuring the future will take care of itself.',
  'My behavior is only influenced by the immediate (i.e., a matter of days or weeks) outcomes of my actions.',
  'My convenience is a big factor in the decisions I make or the actions I take.',
  'I am willing to sacrifice my immediate happiness or well-being in order to achieve future outcomes.',
  'I think it is important to take warnings about negative outcomes seriously even if the negative outcome will not occur for many years.',
  'I think it is more important to perform a behavior with important distant consequences than a behavior with less-important immediate consequences.',
  'I generally ignore warnings about possible future problems because I think the problems will be resolved before they reach crisis level.',
  'I think that sacrificing now is usually unnecessary since future outcomes can be dealt with at a later time.',
  'I only act to satisfy immediate concerns, figuring that I will take care of future problems that may occur at a later date.',
  'Since my day to day work has specific outcomes, it is more important to me than behavior that has distant outcomes.',
  'When I make a decision, I think about how it might affect me in the future.',
  'My behavior is generally influenced by future consequences.'
];
// Global item counter: CFC 14 + attention check 1 + ICS 16 = 31
let qIndex = 0;
let cfcCurrent = 0;
let cfcAnswers = new Array(14).fill(null);

function renderCfcItem(idx) {
  const opts = CFC_LABELS.map((l, k) => {
    const sel = cfcAnswers[idx] === k + 1;
    return `<div class="scale-option" id="cfc-opt-${k+1}"${sel ? ' style="border-color:#28a745;background:#d4edda;"' : ''}><div class="num">${k+1}</div><div class="label">${l}</div></div>`;
  }).join('');
  const backHint = idx > 0 ? '<div class="scale-hint" style="margin-top:12px;font-size:15px;">Press B to go back to the previous item</div>' : '';
  return `<div class="scale-question" id="cfc-container">
      <div class="page-indicator">Question ${qIndex+1} / 31</div>
      <div class="question-text">${cfcItems[idx]}</div>
      <div class="scale-options">${opts}</div>
      <div class="scale-hint">Please press a number key from 1 to 7</div>
      ${backHint}
    </div>`;
}

timeline.push({
  type: jsPsychHtmlKeyboardResponse,
  stimulus: function() { return renderCfcItem(cfcCurrent); },
  choices: "NO_KEYS",
  data: { task: 'cfc_block' },
  on_load: function() {
    let locked = false;
    let kb = null;
    function update() {
      const el = document.getElementById('cfc-container');
      if (el) el.outerHTML = renderCfcItem(cfcCurrent);
    }
    function bind() {
      kb = jsPsych.pluginAPI.getKeyboardResponse({
        callback_function: onKey,
        valid_responses: ['1','2','3','4','5','6','7','b','B'],
        rt_method: 'performance', persist: true, allow_held_key: false
      });
    }
    function onKey(info) {
      const key = info.key.toLowerCase();
      if (locked) return;
      if (key === 'b') {
        if (cfcCurrent > 0) { cfcCurrent--; qIndex--; cfcAnswers[cfcCurrent] = null; update(); }
        return;
      }
      const n = parseInt(key);
      locked = true;
      cfcAnswers[cfcCurrent] = n;
      const opt = document.getElementById('cfc-opt-' + n);
      if (opt) { opt.style.borderColor = '#28a745'; opt.style.background = '#d4edda'; opt.style.transform = 'scale(1.06)'; }
      setTimeout(function() {
        locked = false;
        if (cfcCurrent < 13) { cfcCurrent++; qIndex++; update(); }
        else {
          if (kb) jsPsych.pluginAPI.cancelKeyboardResponse(kb);
          qIndex++;
          jsPsych.finishTrial({});
        }
      }, 320);
    }
    bind();
    injectQuitButton();
  },
  on_finish: function(data) {
    data.responses = JSON.stringify(cfcAnswers);
    cfcAnswers = new Array(14).fill(null);
    cfcCurrent = 0;
  }
});

// ================= Attention check (between CFC and ICS, Question 15/31) =================
timeline.push({
  type: jsPsychHtmlKeyboardResponse,
  stimulus: function() {
    const opts = CFC_LABELS.map((l, k) =>
      `<div class="scale-option"><div class="num">${k+1}</div><div class="label">${l}</div></div>`).join('');
    return `<div class="scale-question">
        <div class="page-indicator">Question ${qIndex+1} / 31</div>
        <div class="question-text">To ensure the quality of the data, please select 6 (very much like me) for this item without reading the statement.</div>
        <div class="scale-options">${opts}</div>
        <div class="scale-hint">Please press a number key from 1 to 7</div>
      </div>`;
  },
  choices: "NO_KEYS",
  data: { task: 'attention_check' },
  on_load: function() {
    injectQuitButton();
    let locked = false;
    const kb = jsPsych.pluginAPI.getKeyboardResponse({
      callback_function: function(info) {
        if (locked) return;
        locked = true;
        const n = parseInt(info.key);
        const opt = document.querySelectorAll('.scale-option')[n - 1];
        if (opt) opt.style.cssText += 'border-color:#28a745;background:#d4edda;transform:scale(1.06);';
        setTimeout(function() {
          jsPsych.pluginAPI.cancelKeyboardResponse(kb);
          qIndex++;
          jsPsych.finishTrial({ response: info.key, rt: Math.round(info.rt), score: n });
        }, 320);
      },
      valid_responses: ['1','2','3','4','5','6','7'],
      rt_method: 'performance', persist: true, allow_held_key: false
    });
  },
  on_finish: function(data) {
    data.attention_check_correct = (data.score === 6);
  }
});

// ================= ICS-16 (English official version; randomized order per participant) =================
const ICS_LABELS = CFC_LABELS;
const ICS16 = [
  {dim:'HI', text:"I'd rather depend on myself than others."},
  {dim:'HI', text:'I rely on myself most of the time; I rarely rely on others.'},
  {dim:'HI', text:'I often do "my own thing".'},
  {dim:'HI', text:'My personal identity, independent of others, is very important to me.'},
  {dim:'VI', text:'It is important that I do my job better than others.'},
  {dim:'VI', text:'Winning is everything.'},
  {dim:'VI', text:'Competition is the law of nature.'},
  {dim:'VI', text:'When another person does better than I do, I get tense and aroused.'},
  {dim:'HC', text:'If a coworker gets a prize, I would feel proud.'},
  {dim:'HC', text:'The well-being of my coworkers is important to me.'},
  {dim:'HC', text:'To me, pleasure is spending time with others.'},
  {dim:'HC', text:'I feel good when I cooperate with others.'},
  {dim:'VC', text:'Parents and children must stay together as much as possible.'},
  {dim:'VC', text:'It is my duty to take care of my family, even when I have to sacrifice what I want.'},
  {dim:'VC', text:'Family members should stick together, no matter what sacrifices are required.'},
  {dim:'VC', text:'It is important to me that I respect the decisions made by my groups.'}
];
const icsOrder = ICS16.map((_, i) => i);
for (let i = icsOrder.length - 1; i > 0; i--) {
  const j = Math.floor(Math.random() * (i + 1));
  const t = icsOrder[i]; icsOrder[i] = icsOrder[j]; icsOrder[j] = t;
}
let icsCurrent = 0;
let icsAnswers = new Array(16).fill(null);

function renderIcsItem(idx) {
  const it = ICS16[icsOrder[idx]];
  const opts = ICS_LABELS.map((l, k) => {
    const sel = icsAnswers[idx] === k + 1;
    return `<div class="scale-option" id="ics-opt-${k+1}"${sel ? ' style="border-color:#28a745;background:#d4edda;"' : ''}><div class="num">${k+1}</div><div class="label">${l}</div></div>`;
  }).join('');
  const backHint = idx > 0 ? '<div class="scale-hint" style="margin-top:12px;font-size:15px;">Press B to go back to the previous item</div>' : '';
  return `<div class="scale-question" id="ics-container">
      <div class="page-indicator">Question ${qIndex+1} / 31</div>
      <div class="question-text">${it.text}</div>
      <div class="scale-options">${opts}</div>
      <div class="scale-hint">Please press a number key from 1 to 7</div>
      ${backHint}
    </div>`;
}

timeline.push({
  type: jsPsychHtmlKeyboardResponse,
  stimulus: function() { return renderIcsItem(icsCurrent); },
  choices: "NO_KEYS",
  data: { task: 'ics_block' },
  on_load: function() {
    let locked = false;
    let kb = null;
    function update() {
      const el = document.getElementById('ics-container');
      if (el) el.outerHTML = renderIcsItem(icsCurrent);
    }
    function bind() {
      kb = jsPsych.pluginAPI.getKeyboardResponse({
        callback_function: onKey,
        valid_responses: ['1','2','3','4','5','6','7','b','B'],
        rt_method: 'performance', persist: true, allow_held_key: false
      });
    }
    function onKey(info) {
      const key = info.key.toLowerCase();
      if (locked) return;
      if (key === 'b') {
        if (icsCurrent > 0) { icsCurrent--; qIndex--; icsAnswers[icsCurrent] = null; update(); }
        return;
      }
      const n = parseInt(key);
      locked = true;
      icsAnswers[icsCurrent] = n;
      const opt = document.getElementById('ics-opt-' + n);
      if (opt) { opt.style.borderColor = '#28a745'; opt.style.background = '#d4edda'; opt.style.transform = 'scale(1.06)'; }
      setTimeout(function() {
        locked = false;
        if (icsCurrent < 15) { icsCurrent++; qIndex++; update(); }
        else {
          if (kb) jsPsych.pluginAPI.cancelKeyboardResponse(kb);
          qIndex++;
          jsPsych.finishTrial({});
        }
      }, 320);
    }
    bind();
    injectQuitButton();
  },
  on_finish: function(data) {
    const dims = { HI: [], VI: [], HC: [], VC: [] };
    icsOrder.forEach((itemIdx, pos) => { dims[ICS16[itemIdx].dim].push(icsAnswers[pos]); });
    const mean = a => Math.round(a.reduce((x, y) => x + y, 0) / a.length * 100) / 100;
    data.ics_HI = mean(dims.HI); data.ics_VI = mean(dims.VI);
    data.ics_HC = mean(dims.HC); data.ics_VC = mean(dims.VC);
    data.ics_I = Math.round((data.ics_HI + data.ics_VI) / 2 * 100) / 100;
    data.ics_C = Math.round((data.ics_HC + data.ics_VC) / 2 * 100) / 100;
    data.ics_responses = JSON.stringify(icsOrder.map((itemIdx, pos) => ({
      item: itemIdx + 1, dim: ICS16[itemIdx].dim, score: icsAnswers[pos]
    })));
    icsAnswers = new Array(16).fill(null);
    icsCurrent = 0;
  }
});

// ================= End and payment =================
let completionRedirected = false;
function goToCompletion() {
  if (completionRedirected) return;
  completionRedirected = true;
  if (COMPLETION_URL && COMPLETION_URL.indexOf('REPLACE_CODE') === -1) {
    window.location.href = COMPLETION_URL;
  }
}

timeline.push({
  type: jsPsychHtmlKeyboardResponse,
  stimulus: function() {
    return `<div class="instruction-box">
      <h2>The study is complete. Thank you for your participation!</h2>
      <p style="font-size:18px;line-height:2;max-width:720px;margin:0 auto;">
        <b>Your responses are being uploaded now.</b><br>
        This usually takes 10&ndash;20 seconds. Please <b>do not close or refresh this tab</b> until you are automatically redirected back to Prolific.<br>
        Closing the page early may cause your responses to be lost.
      </p>
      <p style="margin-top:30px;font-size:18px;color:#6c757d;">You will be redirected automatically &mdash; please wait.</p>
    </div>`;
  },
  choices: "NO_KEYS",
  data: { task: 'end' },
  on_load: function() {
    // 结束页一出现：记时长 → 本地下载兜底 → sendBeacon 上传（跳转不中断）→ 1.2 秒后自动跳回 Prolific
    try {
      jsPsych.data.get().addToLast({
        exp_end: 'end',
        total_duration_min: Math.round((Date.now() - expStartTime) / 6000) / 10
      });
    } catch(e) {}
    try { downloadCSV(false); } catch(e) {}
    // 修复版：等上传真正完成（或 8 秒超时兜底）再跳回 Prolific，大数据包不再被 1.2 秒跳转掐断
    var uploadDone = false;
    try { uploadCSV(false, 'complete').then(function() { uploadDone = true; }); } catch(e) { uploadDone = true; }
    var startWait = Date.now();
    var waitTimer = setInterval(function() {
      if (uploadDone || Date.now() - startWait > 8000) {
        clearInterval(waitTimer);
        goToCompletion();
      }
    }, 300);
  },
  on_finish: function() {
    if (!completionRedirected) {
      document.body.innerHTML = '<div style="text-align:center;padding:120px 40px;font-family:Arial,sans-serif;">' +
        '<h2 style="font-size:24px;color:#333;">Thank you for your participation</h2>' +
        '<p style="font-size:16px;color:#6c757d;margin-top:12px;">Your data have been saved. Please return to Prolific to submit.</p></div>';
    }
  }
});jsPsych.run(timeline);
</script>
